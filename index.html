<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha Agenda</title>
  <meta name="description" content="Turnos de trabalho, tarefas, provas e pastas do Drive em um só lugar.">
  <meta name="theme-color" content="#F2F1F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15131F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Minha Agenda">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="back-btn" type="button" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="topbar-title" id="screen-title">Minha Agenda</h1>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="Configurações">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
  </header>

  <div class="offline-banner" id="offline-banner" hidden>Sem internet. Tudo continua funcionando, menos abrir o Drive.</div>

  <main id="app" tabindex="-1"></main>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <form method="dialog" class="sheet-inner" id="sheet-form" novalidate>
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 class="sheet-title" id="sheet-title"></h2>
      <div class="sheet-body" id="sheet-body"></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="reminders.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
